<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Wedding rings logo - Two interlocked rings representing marriage -->
  <defs>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b76e79;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a96e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Left ring (slightly behind) -->
  <circle cx="35" cy="50" r="22" fill="none" stroke="url(#ringGradient)" stroke-width="5" opacity="0.9"/>
  
  <!-- Right ring (slightly in front) -->
  <circle cx="65" cy="50" r="22" fill="none" stroke="url(#ringGradient)" stroke-width="5"/>
  
  <!-- Small heart accent at intersection -->
  <path d="M50 42 C47 38, 42 40, 42 44 C42 48, 50 54, 50 54 C50 54, 58 48, 58 44 C58 40, 53 38, 50 42" fill="url(#ringGradient)"/>
</svg>